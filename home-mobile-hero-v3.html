/* ───────────── app ───────────── */
const TABS = [
  { k: 'inicio', l: 'Início', i: 'Home' },
  { k: 'transacoes', l: 'Transações', i: 'List' },
  { k: 'graficos', l: 'Análises', i: 'Chart' },
  { k: 'mais', l: 'Mais', i: 'Grid' },
];

/* Escala da saúde financeira: 0–100 com cor por faixa. O arco usa a cor da
   faixa e o nível fica escrito — a cor reforça, não é a única informação.
   Cores escolhidas por medição sobre o topo do degradê (#4C1D95): todas >= 4:1,
   e o texto do nível usa a variante que passa em 4.5:1. */
const FAIXAS = [
  { ate: 20,  lvl: 'Crítica',   cor: '#FB7185' },
  { ate: 40,  lvl: 'Ruim',      cor: '#FB923C' },
  { ate: 60,  lvl: 'Atenção',   cor: '#FCD34D' },
  { ate: 80,  lvl: 'Boa',       cor: '#4ADE80' },
  { ate: 100, lvl: 'Excelente', cor: '#5EEAD4' },
];
const faixaDe = (n) => FAIXAS.find((f) => n <= f.ate) || FAIXAS[FAIXAS.length - 1];

function AnelSaude({ score }) {
  const f = faixaDe(score);
  const R = 16.5, C = 2 * Math.PI * R;
  return (
    <button className="hf-ring" onClick={() => window.dispatchEvent(new CustomEvent('gf3-sheet', { detail: 'saude' }))}
      aria-label={'Saúde financeira ' + score + ' de 100, nível ' + f.lvl + '. Toque para ver detalhes'}>
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
        {/* Substrato escuro medido: sem ele as faixas crítica (2.33:1) e ruim
            (2.77:1) não passavam em 3:1 na base do degradê. Com ele, a pior
            faixa vai a 4.96:1. A trilha não chega a 3:1 e é decorativa de
            propósito — o número está escrito no centro do anel. */}
        <circle cx="18" cy="18" r={R} fill="rgba(15,23,42,.55)" />
        <circle cx="18" cy="18" r={R} fill="none" stroke="rgba(255,255,255,.30)" strokeWidth="3.4" />
        <circle cx="18" cy="18" r={R} fill="none" stroke={f.cor} strokeWidth="3.4" strokeLinecap="round"
          strokeDasharray={C.toFixed(1)} strokeDashoffset={(C * (1 - score / 100)).toFixed(1)}
          style={{ transition: 'stroke-dashoffset .8s cubic-bezier(.22,1,.36,1), stroke .4s' }} />
      </svg>
      <b className="num">{score}</b>
      {/* selo com seta: o mesmo tratamento do sino de alertas (badge no canto),
          pra sinalizar que o anel é tocável e abre mais detalhe. */}
      <span className="go" aria-hidden="true"><I.Star size={8} /></span>
    </button>
  );
}

/* O topo agora é o cabeçalho da área de destaque: marca, filtro, alertas, mês,
   saldo e saúde. Tudo em um bloco só, para o degradê começar no topo da tela. */
function TopoHero({ mes, setMes, quem, setQuem, setSheet, m, mesIdx }) {
  const d = new Date(2026, 8 + mesIdx, 1);
  const rotulo = MESES[d.getMonth()] + ' ' + d.getFullYear();
  const pessoa = quem === 'todos' ? null : PESSOAS.find((p) => p.id === +quem).n;
  return (
    <section className="herofull rise" aria-labelledby="t-saldo" data-od-id="hero-saldo">
      <div className="inner">
        <div className="toprow">
          <div className="brandmark"><span className="dot">G</span><span>Finanças</span></div>
          <button className="iconbtn plain" onClick={() => setSheet('filtro')} aria-label="Filtrar por pessoa"
            style={{ position: 'relative' }}>
            <I.Filter size={19} />
            {pessoa && <span style={{ position: 'absolute', top: 8, right: 9, width: 7, height: 7, borderRadius: '50%', background: '#DDD6FE', border: '1.5px solid #4C1D95' }} />}
          </button>
          <AnelSaude score={SAUDE.score} />
          <button className="iconbtn" onClick={() => setSheet('alertas')} aria-label={ALERTAS.length + ' alertas de hoje'}>
            <I.Bell size={20} /><span className="badge">{ALERTAS.length}</span>
          </button>
        </div>

        <div className="monthnav">
          <button className="chev" onClick={() => setMes((v) => v - 1)} aria-label="Mês anterior"><I.Left size={18} /></button>
          <div className="lab">
            <strong>{rotulo}</strong>
            <em>{mesIdx > 0 ? 'projetado' : mesIdx < 0 ? 'encerrado' : 'atual'}</em>
          </div>
          <button className="chev" onClick={() => setMes((v) => v + 1)} aria-label="Próximo mês"><I.Right size={18} /></button>
        </div>
        <div className="hf-who">
          {pessoa && <span>{pessoa}</span>}
        </div>
        <div className="hf-core">
          <div className="hf-balance" data-od-id="saldo-disponivel">
            <div className="bcol">
              <p className="lbl" id="t-saldo"><i><I.Wallet size={13} /></i> Saldo disponível</p>
              <p className="val num">{fmt(DISPONIVEL)}</p>
            </div>
            <span className="hf-trend" aria-hidden="true">
              <span className="spark s1"><I.Sparkle size={9} /></span>
              <span className="spark s2"><I.Sparkle size={7} /></span>
              <span className="spark s3"><I.Sparkle size={6} /></span>
              <I.ArrowUpRight size={20} />
            </span>
          </div>
        </div>

        <button className="hf-proj" data-od-id="saldo-fim-mes" onClick={() => setSheet('fimmes')}>
          <span className="hf-proj-ic"><I.Trend size={16} /></span>
          <span className="hf-proj-txt">
            <span className="hf-proj-lbl">Saldo previsto no fim do mês</span>
            <b className={'num ' + (m.fimMes >= 0 ? 'pos' : 'neg')}>
              {m.fimMes >= 0 ? '+ ' : '− '}{fmt(Math.abs(m.fimMes), 0)}
            </b>
          </span>
        </button>

        <GraficoSaldo m={m} />
      </div>
    </section>
  );
}

function App() {
  const [mes, setMes] = useState(0);
  const [quem, setQuem] = useState(() => localStorage.getItem('gf3-quem') || 'todos');
  const [tab, setTab] = useState('inicio');
  const [sheet, setSheet] = useState(null);
  const [vazio, setVazio] = useState(() => localStorage.getItem('gf3-vazio') === '1');
  const [arrastando, setArrastando] = useState(0);
  const [contasBase, setContasBase] = useState(ABERTAS);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const start = useRef(null);

  const aviso = useCallback((t, d) => {
    setToast({ t: t, d: d });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 4200);
  }, []);
  useEffect(() => () => clearTimeout(toastTimer.current), []);

  useEffect(() => { localStorage.setItem('gf3-quem', quem); }, [quem]);
  useEffect(() => { localStorage.setItem('gf3-vazio', vazio ? '1' : '0'); }, [vazio]);
  useEffect(() => { const b = document.getElementById('b-data'); if (b) b.setAttribute('aria-pressed', String(vazio)); }, [vazio]);
  // O botão de revisão está fora do React (barra de ferramentas): ele conversa
  // por evento em vez de manipular o DOM do app. O anel de saúde usa o mesmo
  // canal, para não depender de um global frágil.
  useEffect(() => {
    const onVazio = (e) => setVazio(Boolean(e.detail));
    const onSheet = (e) => setSheet(e.detail);
    window.addEventListener('gf3-vazio', onVazio);
    window.addEventListener('gf3-sheet', onSheet);
    return () => { window.removeEventListener('gf3-vazio', onVazio); window.removeEventListener('gf3-sheet', onSheet); };
  }, []);

  const contas = useMemo(() => (quem === 'todos' ? contasBase : contasBase.filter((c) => c.who === +quem)), [quem, contasBase]);
  const m = useMemo(() => modelo(contas), [contas]);

  /* Registra o lançamento de verdade: o valor em aberto do cartão cai na hora e
     a lista se reordena. Era o único caminho que faltava no protótipo — antes
     o botão só fechava a folha. */
  const registrar = (id, valor) => {
    const c = contasBase.find((x) => x.id === id);
    if (!c) return;
    const restante = restanteDe(c);
    const v = Math.min(valor, restante);
    const quita = restante - v < 0.005;
    setContasBase((cs) => cs.map((x) => (x.id === id ? { ...x, pago: Math.min(x.valor, (x.pago || 0) + v) } : x)));
    setSheet(null);
    aviso(
      (c.tipo === 'receita' ? 'Recebimento de ' : 'Pagamento de ') + fmt(v),
      c.desc + (quita ? ' · conta quitada' : ' · restam ' + fmt(restante - v))
    );
  };

  const onDown = (e) => { start.current = { x: e.clientX, y: e.clientY }; };
  const onMove = (e) => {
    if (!start.current) return;
    const dx = e.clientX - start.current.x, dy = e.clientY - start.current.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) setArrastando(dx);
  };
  const onUp = () => {
    if (arrastando < -55) setMes((v) => v + 1);
    else if (arrastando > 55) setMes((v) => v - 1);
    setArrastando(0); start.current = null;
  };

  const selId = sheet && (sheet.indexOf('conta:') === 0 || sheet.indexOf('pagar:') === 0) ? +sheet.split(':')[1] : null;
  const contaSel = selId != null ? contasBase.find((c) => c.id === selId) : null;

  return (
    <>
      <TopoHero mes={mes} setMes={setMes} quem={quem} setQuem={setQuem} setSheet={setSheet} m={m} mesIdx={mes} />
      <div onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
        style={{
          transform: 'translateX(' + arrastando * 0.3 + 'px)', opacity: arrastando ? 0.85 : 1,
          transition: arrastando ? 'none' : 'transform .32s cubic-bezier(.22,1,.36,1), opacity .32s',
        }}>
        {tab === 'inicio'
          ? <Inicio key={mes} m={m} mes={mes} quem={quem} setQuem={setQuem} onSheet={setSheet} vazio={vazio} />
          : <Placeholder t={(TABS.find((t) => t.k === tab) || {}).l} />}
      </div>

      <nav className="tabs" aria-label="Navegação principal" data-od-id="nav-principal">
        <span className="tabs-bg" aria-hidden="true" />
        {TABS.map((t, i) => {
          const Ic = I[t.i];
          return (
            <button key={t.k} data-od-id={'tab-' + t.k} style={{ gridColumn: i < 2 ? i + 1 : i + 2 }}
              aria-current={tab === t.k ? 'page' : undefined} onClick={() => setTab(t.k)}>
              <Ic size={22} /><span>{t.l}</span>
            </button>
          );
        })}
        <button className="tabs-fab" data-od-id="fab-novo" onClick={() => setSheet('novo')} aria-label="Novo lançamento">
          <I.Plus size={26} />
        </button>
      </nav>

      {sheet === 'filtro' && <FiltroSheet quem={quem} setQuem={setQuem} onClose={() => setSheet(null)} />}
      {sheet === 'alertas' && <AlertasSheet onClose={() => setSheet(null)} />}
      {sheet === 'saude' && <SaudeSheet onClose={() => setSheet(null)} />}
      {sheet === 'fimmes' && (
        <Sheet titulo="Saldo no fim do mês" sub={'Previsto para 30 de setembro · ' + fmt(m.fimMes, 0)} onClose={() => setSheet(null)}>
          <div className="metric">
            <div className="mh"><b>Como o número é formado</b></div>
            <p style={{ marginTop: 0 }}>Saldo disponível de hoje, mais o que ainda entra, menos o que ainda sai neste mês.</p>
          </div>
          <div className="metric"><div className="mh"><b>Saldo disponível hoje</b><span className="num">{fmt(DISPONIVEL, 0)}</span></div></div>
          <div className="metric"><div className="mh"><b>A receber</b><span className="num" style={{ color: 'var(--income)' }}>+{fmt(m.aReceber, 0)}</span></div></div>
          <div className="metric"><div className="mh"><b>A pagar</b><span className="num" style={{ color: 'var(--expense)' }}>−{fmt(m.aPagar, 0)}</span></div></div>
          <div className="metric" style={{ paddingTop: 14, borderTop: '1px solid var(--border)' }}>
            <div className="mh"><b>Fecha o mês</b><span className="num" style={{ fontSize: 15 }}>{fmt(m.fimMes, 0)}</span></div>
            <p>Menor saldo do mês: {fmt(m.minSaldo, 0)} no dia {m.minDia}.</p>
          </div>
        </Sheet>
      )}
      {sheet === 'reserva' && (
        <Sheet titulo="Reserva mínima" sub={'Aporte do mês · ' + fmt(RESERVA.aporte, 0)} onClose={() => setSheet(null)}>
          <div className="metric">
            <div className="mh"><b>Disponível na reserva</b><span className="num" style={{ color: 'var(--income)' }}>{fmt(m.reservaDisp, 0)}</span></div>
            <div className="track"><i style={{ width: m.reservaPct + '%', background: 'var(--income)' }} /></div>
            <p>Você usou {fmt(RESERVA.usado, 0)} do aporte de {fmt(RESERVA.aporte, 0)} — restam {Math.round(100 - m.reservaPct)}%.</p>
          </div>
          <div className="metric"><div className="mh"><b>Como é calculada</b></div>
            <p style={{ marginTop: 0 }}>15% do salário líquido do mês. A reserva não acumula: no mês seguinte vale o aporte cheio novamente.</p></div>
        </Sheet>
      )}
      {sheet === 'mercado' && (
        <Sheet titulo="Orçamento de mercado" sub={'Setembro · ' + fmt(MERCADO.limite, 0) + ' definidos'} onClose={() => setSheet(null)}>
          <div className="metric">
            <div className="mh"><b>Posso gastar ainda</b><span className="num" style={{ color: 'var(--warn)' }}>{fmt(m.mercadoResta, 0)}</span></div>
            <div className="track"><i style={{ width: m.mercadoPct + '%', background: 'var(--warn)' }} /></div>
            <p>{fmt(MERCADO.gasto, 0)} já gastos no supermercado — {Math.round(m.mercadoPct)}% do limite do mês.</p>
          </div>
        </Sheet>
      )}
      {sheet === 'todas' && (
        <Sheet titulo="Transações" onClose={() => setSheet(null)}>
          <p className="sub">A tela completa de transações entra na próxima rodada. As {m.contas.length} contas em aberto desta visão são as mesmas que aparecem na home.</p>
        </Sheet>
      )}
      {sheet === 'novo' && (
        <Sheet titulo="Novo lançamento" onClose={() => setSheet(null)}>
          <p className="sub">O formulário de lançamento — despesa, receita, parcelamento — entra na próxima rodada. O atalho do meio da barra já está no lugar dele.</p>
        </Sheet>
      )}
      {contaSel && sheet.indexOf('pagar:') === 0 && (
        <PagamentoSheet conta={contaSel} onClose={() => setSheet(null)} onConfirmar={registrar} />
      )}
      {contaSel && sheet.indexOf('pagar:') !== 0 && (
        <Sheet titulo={contaSel.desc} sub={CATS[contaSel.cat].l + ' · ' + estadoLongo(contaSel)} onClose={() => setSheet(null)}>
          <div className="metric">
            <div className="mh">
              <b>{quitadaDe(contaSel) ? (contaSel.tipo === 'receita' ? 'Total recebido' : 'Total pago')
                : (contaSel.tipo === 'receita' ? 'A receber' : 'Em aberto')}</b>
              <span className="num" style={{ color: contaSel.tipo === 'receita' ? 'var(--income)' : 'var(--ink)' }}>
                {fmt(quitadaDe(contaSel) ? contaSel.valor : restanteDe(contaSel), 0)}
              </span>
            </div>
            {!quitadaDe(contaSel) && (contaSel.pago || 0) > 0 && (
              <p style={{ marginTop: 6 }}>Já {contaSel.tipo === 'receita' ? 'recebido' : 'pago'}: {fmt(contaSel.pago, 0)} de {fmt(contaSel.valor, 0)}.</p>
            )}
          </div>
          <div className="metric"><div className="mh"><b>Vencimento</b><span>{dia(contaSel.vence)}</span></div>
            <p style={{ marginTop: 0 }}>Data indicada pelo motor de priorização: {dia(contaSel.indic)}.
              {contaSel.indic !== contaSel.vence ? ' O motor antecipou o lançamento para caber no caixa do dia.' : ' O motor manteve a data original.'}</p></div>
          <div className="metric"><div className="mh"><b>Prioridade</b><span style={{ textTransform: 'capitalize' }}>{contaSel.prio === 'flexivel' ? 'flexível' : contaSel.prio}</span></div></div>
          <div className="metric"><div className="mh"><b>Responsável</b><span>{contaSel.who ? PESSOAS.find((p) => p.id === contaSel.who).n : 'Casal'}</span></div></div>
          {quitadaDe(contaSel) ? (
            <p className={'bc-done-lbl' + (contaSel.tipo === 'receita' ? ' rec' : '')} style={{ marginTop: 8 }}>
              <I.Check size={15} /> {contaSel.tipo === 'receita' ? 'Recebimento concluído' : 'Pagamento concluído'}
            </p>
          ) : (
            <button className="cta solid" data-od-id="abrir-pagamento" style={{ marginTop: 8 }}
              onClick={() => setSheet('pagar:' + contaSel.id)}>
              <I.Card size={16} /> {contaSel.tipo === 'receita' ? 'Registrar recebimento' : 'Registrar pagamento'}
            </button>
          )}
        </Sheet>
      )}
      {toast && (
        <div className="toast" role="status" aria-live="polite">
          <b>{toast.t}</b><span>{toast.d}</span>
        </div>
      )}
    </>
  );
}

function toggleEmpty() {
  const b = document.getElementById('b-data');
  const on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', String(on));
  window.dispatchEvent(new CustomEvent('gf3-vazio', { detail: on }));
}
window.addEventListener('gf3-vazio', (e) => { try { localStorage.setItem('gf3-vazio', e.detail ? '1' : '0'); } catch (x) {} });

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
