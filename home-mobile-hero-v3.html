<!DOCTYPE html>
<html lang="pt-BR">
<head><script type="application/json" data-od-external-dependencies>["https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap","https://unpkg.com/@babel/standalone@7.29.0/babel.min.js","https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js","https://unpkg.com/react@18.3.1/umd/react.development.js"]</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#F7F6FB" />
<title>Gestão Financeira — Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   SISTEMA VISUAL — inspirado nas referências: premium, claro, violeta como marca
   Regra de cor (mantida do pedido anterior):
     verde  = dinheiro que entra        vermelho = dinheiro que sai
     violeta= marca, ação, navegação    âmbar    = atenção
   ========================================================================== */
:root{
  --canvas:#F7F6FB; --surface:#FFFFFF; --surface-2:#F1EFF8; --border:#E9E6F2;
  --ink:#15132A; --ink-2:#4B5563; --muted:#6B7280;
  --violet:#6D28D9; --violet-deep:#4C1D95; --violet-bright:#7C3AED; --violet-soft:#EDE9FE;
  --income:#047857; --income-soft:#E4F5EE; --income-border:#CBEBDA;
  --expense:#B91C1C; --expense-soft:#FCEAEA; --expense-border:#F7D2D2;
  --warn:#9C500A; --warn-soft:#FBF0E0; --warn-border:#F1DFB2;
  --info:#1D4ED8; --info-soft:#E7EFFE; --info-border:#CBDCFB;
  --shadow-sm:0 1px 2px rgba(21,19,42,.04);
  --shadow:0 6px 20px -6px rgba(21,19,42,.10), 0 2px 6px rgba(21,19,42,.04);
  --shadow-hero:0 18px 40px -14px rgba(76,29,149,.42);
  --font-d:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-b:'Inter',system-ui,sans-serif;
  --r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:30px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{background:#EDEBF3;font-family:var(--font-b);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--violet);border-radius:10px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── tela: no celular ocupa tudo; no desktop vira um canvas de 402px ─────── */
/* .screen: a barra de navegação é fixa (saiu do fluxo), então o conteúdo
   reserva o espaço dela aqui. São 116px porque o que manda não é a barra
   (76px), e sim o topo do botão central, que sobe 31px acima dela. */
.screen{background:var(--canvas);min-height:100dvh;max-width:520px;margin:0 auto;position:relative;
  overflow-x:hidden;padding-bottom:calc(116px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){
  body{padding:28px 0}
  .screen{min-height:calc(100dvh - 56px);border-radius:44px;box-shadow:0 30px 70px -20px rgba(21,19,42,.3);border:1px solid #DEDBEA}
}
@media (min-width:640px) and (max-height:900px){ body{padding:0} .screen{min-height:100dvh;border-radius:0} .devbar{display:none!important} }

/* ── barra de revisão (ferramenta, fora do app) ─────────────────────────── */
.devbar{position:sticky;top:0;z-index:90;display:flex;align-items:center;gap:10px;padding:9px 14px;background:#15132A;color:#fff;
  font-size:12px;font-weight:600;font-family:var(--font-d)}
.devbar b{margin-right:auto;font-size:12.5px}
.devbar button{padding:6px 11px;border-radius:9px;background:rgba(255,255,255,.13);font-size:11.5px;font-weight:700;min-height:32px}
.devbar button[aria-pressed="true"]{background:#fff;color:#15132A}

/* ── topo (vive dentro da área de destaque; ver .herofull) ─────────────── */
.toprow{display:flex;align-items:center;gap:9px;min-height:44px}
.brandmark{display:flex;align-items:center;gap:9px;margin-right:auto}
.brandmark .dot{width:30px;height:30px;border-radius:11px;background:linear-gradient(135deg,var(--violet-bright),var(--violet-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-d);font-weight:800;font-size:14px;box-shadow:0 4px 12px -3px rgba(109,40,217,.5)}
.brandmark span{font-family:var(--font-d);font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;transition:transform .12s ease,background .15s}
.iconbtn:active{transform:scale(.93)}
.iconbtn.plain{background:transparent;border-color:transparent}
.iconbtn.plain:hover{background:var(--surface)}
.iconbtn:not(.plain):hover{background:var(--surface-2)}
.badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--expense);color:#fff;
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}

/* anel de saude financeira */
.ring{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--font-d);font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:-.02em}

/* seletor de mes: discreto, com swipe */
.monthnav{display:flex;align-items:center;justify-content:center;gap:2px;margin:14px 0 2px}
.monthnav .lab{display:flex;align-items:baseline;gap:7px;padding:6px 10px;border-radius:12px}
.monthnav .lab strong{font-family:var(--font-d);font-size:16.5px;font-weight:700;letter-spacing:-.02em;text-transform:capitalize}
.monthnav .lab em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--muted)}
.monthnav .chev{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s}
.monthnav .chev:hover{background:var(--surface-2)}

/* ── ÁREA DE DESTAQUE DO SALDO: 100% da largura, do topo até acima dos
      indicadores. Degradê VERTICAL sobre duas camadas radiais (azul no topo
      à direita, magenta na base à esquerda) — mais escuro onde vive o texto.
      Medido: o topo agora é #2A0A63, mais escuro que o #4C1D95 anterior, e
      como o texto branco sobre ele passa de 12:1, a cauda do degradê (#6D28D9)
      continua >= 4.6:1 — pior ponto da tela. ── */
.herofull{position:relative;color:#fff;overflow:hidden;
  background:
    radial-gradient(130% 70% at 88% -12%,rgba(56,189,248,.30),rgba(56,189,248,0) 60%),
    radial-gradient(110% 60% at 6% 112%,rgba(217,70,239,.26),rgba(217,70,239,0) 62%),
    radial-gradient(90% 55% at 50% 42%,rgba(124,58,237,.50),rgba(124,58,237,0) 72%),
    linear-gradient(180deg,#2A0A63 0%,#3B1483 26%,#4C1D95 52%,#5B21B6 78%,#6D28D9 100%);
  border-radius:0 0 32px 32px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 20px 20px;
  margin-bottom:16px;
  box-shadow:0 26px 50px -18px rgba(46,16,101,.55)}
.herofull::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 68%);pointer-events:none}
.herofull::before{content:"";position:absolute;left:-60px;top:120px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(167,139,250,.30),rgba(167,139,250,0) 70%);pointer-events:none}
.herofull .inner{position:relative;z-index:1}
/* respiro lateral de tudo que não é a área de destaque */
.stage{padding:0 20px}

/* topo dentro da área de destaque */
.hf-top{display:flex;align-items:center;gap:9px;min-height:44px}
.herofull .brandmark span{color:#fff}
.herofull .brandmark .dot{background:rgba(255,255,255,.18);box-shadow:none;backdrop-filter:blur(6px)}
.herofull .iconbtn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.22);color:#fff}
.herofull .iconbtn:hover{background:rgba(255,255,255,.26)}
.herofull .iconbtn.plain{background:transparent;border-color:transparent;color:#fff}
.herofull .iconbtn.plain:hover{background:rgba(255,255,255,.14)}
.herofull .badge{background:#FB7185;border-color:#4C1D95;color:#2A0A38}

/* mês dentro da área de destaque */
.herofull .monthnav{margin:10px 0 0}
.herofull .monthnav .lab strong{color:#fff}
.herofull .monthnav .lab em{color:#EDE9FE;background:rgba(255,255,255,.15);
  padding:2.5px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.herofull .monthnav .chev{color:#DDD6FE}
.herofull .monthnav .chev:hover{background:rgba(255,255,255,.14)}

/* saldo centralizado. O anel de saúde saiu daqui e subiu para o topo, ao lado
   do filtro — então o bloco do saldo ocupa a largura toda e centraliza. O chip
   de variação foi removido: era a terceira vez que a mesma leitura aparecia
   na tela (ele, "entrou no mês" e "saiu no mês"). */
.hf-core{margin-top:16px}

/* saldo disponível: virou um cartão translúcido (não mais texto solto
   centralizado) — rótulo com ícone à esquerda, valor grande alinhado à
   esquerda, e um selo circular verde à direita indicando a tendência
   (mesma leitura de "está subindo"), com um leve brilho decorativo. */
.hf-balance{min-width:0;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.17);
  border-radius:22px;padding:15px 17px;display:flex;align-items:center;gap:12px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 14px 30px -14px rgba(10,4,30,.55)}
.hf-balance .bcol{flex:1;min-width:0;text-align:left}
.hf-balance .lbl{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#DDD6FE;margin:0}
.hf-balance .lbl i{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-style:normal}
.hf-balance .val{font-family:var(--font-d);font-size:clamp(31px,9.6vw,38px);font-weight:800;letter-spacing:-.03em;
  line-height:1.04;margin:8px 0 0}
.hf-trend{position:relative;flex-shrink:0;width:50px;height:50px;border-radius:50%;z-index:0;
  background:linear-gradient(160deg,#34D399,#059669);display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 0 0 5px rgba(52,211,153,.16),0 8px 22px -4px rgba(5,150,105,.65),inset 0 1px 0 rgba(255,255,255,.35)}
.hf-trend::before{content:"";position:absolute;inset:-7px;border-radius:50%;z-index:-1;
  background:rgba(52,211,153,.38);filter:blur(11px)}
.hf-trend .spark{position:absolute;color:#A7F3D0;opacity:.9}
.hf-trend .s1{top:-7px;left:2px;transform:rotate(-12deg)}
.hf-trend .s2{top:-2px;right:-9px;transform:rotate(18deg) scale(.75)}
.hf-trend .s3{bottom:-8px;left:-6px;transform:rotate(6deg) scale(.6)}

/* pílula de "pessoa filtrada": altura reservada sempre, pra não empurrar o
   saldo pra baixo/cima quando o filtro liga e desliga */
.hf-who{min-height:24px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.hf-who span{display:inline-block;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.16);
  font-size:11px;font-weight:700;color:#EDE9FE}

/* anel de saúde no topo: além do fundo translúcido, ganha um selo com seta
   no canto — o mesmo tratamento visual do sino de alertas (badge no canto) —
   pra deixar claro que é tocável e leva a mais detalhe, não só um indicador. */
.hf-ring{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);border-radius:14px;
  transition:background .15s,transform .12s ease}
.hf-ring:hover{background:rgba(255,255,255,.26)}
.hf-ring:active{transform:scale(.93)}
.hf-ring svg{position:absolute;inset:4px;transform:rotate(-90deg)}
.hf-ring b{position:relative;font-family:var(--font-d);font-size:13px;font-weight:800;letter-spacing:-.04em;color:#fff}
.hf-ring .go{position:absolute;bottom:-3px;right:-3px;width:15px;height:15px;border-radius:50%;
  background:#fff;color:var(--violet-deep);display:flex;align-items:center;justify-content:center;
  border:2px solid var(--violet-deep)}

/* saldo previsto para o fim do mês: agora é um cartão próprio (mesma
   linguagem do saldo disponível), alinhado à esquerda, sem textos supérfluos
   — só rótulo + valor com sinal. */
.hf-proj{margin-top:10px;width:100%;display:flex;align-items:center;gap:12px;text-align:left;color:inherit;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.17);border-radius:18px;padding:12px 16px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 26px -14px rgba(10,4,30,.5);
  transition:background .15s,transform .12s ease}
.hf-proj:hover{background:rgba(255,255,255,.17)}
.hf-proj:active{transform:scale(.985)}
.hf-proj-ic{flex-shrink:0;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;color:#fff}
.hf-proj-txt{flex:1;min-width:0}
.hf-proj-lbl{display:block;font-size:12px;font-weight:600;color:#DDD6FE}
.hf-proj b{display:block;font-family:var(--font-d);font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.hf-proj b.pos{color:#6EE7B7}
.hf-proj b.neg{color:#FCA5A5}

/* gráfico embutido no herói: sangria total (ultrapassa o padding lateral do
   card, ficando de ponta a ponta). O eixo de datas vive na base, os valores de
   referência na coluna da direita, e a leitura do ponto sob o dedo/cursor vem
   numa pastilha que acompanha o ponto sem sair do cartão. Uma onda discreta no
   rodapé do herói cria a transição para o conteúdo branco abaixo. */
.hf-chart{margin:14px -20px -20px;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  cursor:crosshair;border-radius:16px}
.hf-chart svg{display:block;width:100%;height:auto;position:relative;z-index:1}
.hf-chart:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.hf-wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:auto;pointer-events:none;z-index:0}
/* pastilha de leitura: sobe acima do ponto e desce quando o ponto está no
   topo do gráfico — assim nunca é cortada pelo herói */
.hf-tip{position:absolute;z-index:3;pointer-events:none;white-space:nowrap;display:flex;flex-direction:column;gap:1px;
  padding:7px 11px;border-radius:12px;background:rgba(18,6,48,.86);border:1px solid rgba(255,255,255,.24);
  box-shadow:0 12px 26px -10px rgba(6,2,26,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transform:translate(-50%,calc(-100% - 12px));animation:fade .14s ease}
.hf-tip.abaixo{transform:translate(-50%,12px)}
.hf-tip span{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:#DDD6FE}
.hf-tip b{font-family:var(--font-d);font-size:13.5px;font-weight:800;letter-spacing:-.02em;color:#fff}

/* ── tons dos ícones (compartilhados entre os cards pequenos) ─────────── */
.i-v{background:var(--violet-soft);color:var(--violet)}
.i-in{background:var(--income-soft);color:var(--income)}
.i-out{background:var(--expense-soft);color:var(--expense)}
.i-w{background:var(--warn-soft);color:var(--warn)}

/* ── reserva mínima + mercado: dois cards lado a lado, abaixo do gráfico ── */
.twocards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.minicard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px;box-shadow:var(--shadow-sm);text-align:left;min-width:0}
.minicard .mt{display:flex;align-items:center;gap:7px;margin-bottom:10px;min-width:0}
.minicard .mt i{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-style:normal}
.minicard .mt span{font-size:11.5px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.minicard b{display:block;font-family:var(--font-d);font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minicard .bar{display:block;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.minicard .bar i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.minicard u{display:block;margin-top:7px;font-size:11px;font-weight:700;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── gráfico ───────────────────────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 18px 14px;margin-top:12px;box-shadow:var(--shadow-sm)}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.panel-h h2{font-family:var(--font-d);font-size:15.5px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1}
.panel-h p{margin:3px 0 0;font-size:12px;color:var(--muted);font-weight:500}
.legend{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-flex;align-items:center;gap:6px;font-style:normal;font-size:11.5px;color:var(--muted);font-weight:500}
.legend i b{width:8px;height:8px;border-radius:50%;display:block}

/* ── lista de contas ───────────────────────────────────────────────────── */
.sect{margin-top:22px}
.sect-h{display:flex;align-items:baseline;gap:9px;margin-bottom:11px;padding:0 2px}
.sect-h h2{font-family:var(--font-d);font-size:17px;font-weight:800;letter-spacing:-.025em;margin:0}
.sect-h span{font-size:12.5px;color:var(--muted);font-weight:600}
/* resumo da seção: quanto ainda sai e quanto ainda entra — os dois números
   que dizem se a lista é problema ou não. */
.bc-sum{display:flex;gap:8px;flex-wrap:wrap;margin:-3px 0 12px;padding:0 2px}
.bc-sum-i{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 11px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--ink-2)}
.bc-sum-i b{font-family:var(--font-d);font-size:13px;font-weight:800;letter-spacing:-.01em}
.bc-sum-i.out b,.bc-sum-i.out svg{color:var(--expense)}
.bc-sum-i.in b,.bc-sum-i.in svg{color:var(--income)}
.bc-sum-empty{display:flex;align-items:center;gap:8px;margin:-3px 0 12px;padding:0 2px;
  font-size:12.5px;font-weight:600;color:var(--income)}

.cta{width:100%;margin-top:11px;min-height:48px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);
  font-family:var(--font-d);font-weight:700;font-size:13.5px;color:var(--violet);display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,color .15s}
.cta:hover{background:var(--violet-soft);border-color:var(--violet-deep);color:var(--violet-deep)}
.cta:active{background:var(--violet-soft);color:var(--violet-deep)}
/* única ação sólida do fluxo: confirmar o lançamento na folha de pagamento */
.cta.solid{background:var(--violet);border-color:var(--violet);color:#fff;font-size:14px;min-height:52px;box-shadow:var(--shadow-hero)}
.cta.solid:hover{background:var(--violet-deep);border-color:var(--violet-deep);color:#fff}
.cta.solid:active{background:var(--violet-deep);border-color:var(--violet-deep)}
.cta.solid:disabled{background:var(--surface-2);border-color:var(--border);color:var(--muted);box-shadow:none;cursor:not-allowed}

/* ── contas em aberto: cartão de conta ────────────────────────────────────
   Versão 5 — o cartão da referência aprovada. Ordem: ícone da categoria +
   título + valor cheio · linha "pago/recebido : restante" · barra com o %
   dentro do preenchimento · dois quadros (vencimento e data recomendada) ·
   ação sólida.
   Três decisões que NÃO são cópia literal do mockup, e por quê:
   1. A cor é a do sinal do dinheiro — verde para receita, vermelho para
      despesa (regra do sistema v2). O mockup mostra uma receita, por isso é
      verde lá; a mesma estrutura numa despesa fica vermelha.
   2. O preenchimento e a ação usam os tokens de receita/despesa, não o verde
      claro do mockup: branco sobre aquele tom dava 3,46:1, abaixo do mínimo
      de 4,5:1 para texto pequeno.
   3. O valor cheio volta a ser o número do topo, como no cartão de
      referência, e "Restante" ganha rótulo próprio — as duas leituras
      ("quanto é" e "quanto falta") convivem sem disputar o mesmo espaço. */
.billlist{display:flex;flex-direction:column;gap:22px}
.billcard{position:relative;border-radius:24px;background:var(--surface);border:1px solid var(--border);
  padding:16px;box-shadow:-8px 8px 0 var(--bc-accent),0 14px 30px -18px rgba(21,19,42,.38);
  transition:transform .16s cubic-bezier(.22,1,.36,1),box-shadow .16s ease}
.billcard:hover{transform:translate(2px,-2px);box-shadow:-11px 11px 0 var(--bc-accent),0 18px 34px -18px rgba(21,19,42,.45)}
.billcard.is-done{box-shadow:-8px 8px 0 var(--border),0 10px 24px -20px rgba(21,19,42,.3)}
.billcard.is-done:hover{transform:translate(2px,-2px);box-shadow:-11px 11px 0 var(--border),0 14px 28px -20px rgba(21,19,42,.35)}
/* o último cartão projeta 8px de placa abaixo: o botão da seção precisa de
   espaço para não encostar nela */
.billlist + .cta{margin-top:26px}
.bc-body{display:block;width:100%;text-align:left;background:none}
.bc-top{display:flex;align-items:flex-start;gap:12px}
.bc-icon{width:40px;height:40px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--bc-soft);color:var(--bc-accent)}
.bc-info{flex:1;min-width:0;padding-top:1px}
.bc-title{display:block;font-family:var(--font-d);font-size:15px;font-weight:800;letter-spacing:-.025em;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-meta{display:block;font-size:11.5px;line-height:1.4;color:var(--muted);font-weight:500;margin-top:3px}
.bc-side{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;padding-left:8px}
.bc-total{font-family:var(--font-d);font-size:20px;font-weight:800;letter-spacing:-.035em;color:var(--ink);
  white-space:nowrap;line-height:1.15}
.billcard.is-done .bc-total{color:var(--muted)}

/* linha de valores: o que já entrou/saiu e o que falta — os dois números que
   a pessoa procura primeiro depois do valor da conta */
.bc-vals{display:flex;align-items:baseline;gap:4px 12px;margin-top:15px;min-width:0;flex-wrap:wrap}
.bc-val{display:inline-flex;align-items:baseline;gap:6px;min-width:0}
.bc-val + .bc-val{margin-left:auto}
.bc-val em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap}
.bc-val b{font-family:var(--font-d);font-size:14px;font-weight:800;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}

/* barra: o % vive dentro do preenchimento; o rótulo, na trilha.
   As posições vêm calculadas do componente — nunca há texto cortado, porque
   o "38%" muda de lado quando o preenchimento é estreito demais e o rótulo
   simplesmente não é desenhado quando a trilha acaba. */
.bc-bar{display:block;position:relative;height:24px;border-radius:999px;background:var(--surface-2);
  overflow:hidden;margin-top:9px}
.bc-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--bc-accent);
  transition:width .5s cubic-bezier(.22,1,.36,1)}
.bc-bar b{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-family:var(--font-d);
  font-size:11.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.bc-bar u{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-style:normal;font-size:9.5px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}

/* os dois quadros: o prazo real à esquerda, a data do motor à direita */
.bc-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.bc-tiles.one{grid-template-columns:1fr}
.bc-tile{display:block;min-width:0;border-radius:16px;padding:10px 11px;background:var(--surface-2)}
.bc-tile.money{background:var(--bc-soft)}
.bc-tile-h{display:flex;align-items:center;gap:6px;min-width:0}
.bc-tile-h i{width:24px;height:24px;border-radius:8px;background:var(--surface);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;color:var(--ink-2)}
.bc-tile.money .bc-tile-h i{color:var(--bc-accent)}
.bc-tile-h span{font-size:9px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-tile-b{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
.bc-tile-b b{font-family:var(--font-d);font-size:16px;font-weight:800;letter-spacing:-.025em;color:var(--ink);
  white-space:nowrap}
.bc-tile.past .bc-tile-b b{color:var(--expense)}
.bc-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;font-size:9.5px;
  font-weight:800;white-space:nowrap;letter-spacing:.01em}
.bc-chip-warn{background:var(--warn-soft);color:var(--warn)}
.bc-chip-late{background:var(--expense-soft);color:var(--expense)}
.bc-chip-done{background:var(--surface);color:var(--ink-2)}
.bc-chip-in{background:var(--surface);color:var(--income)}
.bc-chip-ideal{background:var(--surface);color:var(--bc-accent)}

/* ação: sólida na cor do dinheiro, como no cartão de referência */
.bc-cta{width:100%;margin-top:14px;min-height:52px;border-radius:20px;background:var(--bc-accent);color:#fff;
  font-family:var(--font-d);font-weight:800;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 10px 22px -12px rgba(21,19,42,.5);transition:filter .15s,transform .12s ease}
.bc-cta:hover{filter:brightness(.9)}
.bc-cta:active{transform:scale(.985);filter:brightness(.85)}
.billcard.is-done .bc-cta{background:var(--surface-2);color:var(--ink-2);box-shadow:none}
.bc-done-lbl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;min-height:52px;
  border-radius:20px;background:var(--surface-2);color:var(--ink-2);font-family:var(--font-d);font-weight:800;font-size:13.5px}
.bc-done-lbl.rec{background:var(--income-soft);color:var(--income)}

/* ── linha do tempo 12 meses (compacta) ────────────────────────────────── */
.trend .bars{display:flex;align-items:flex-end;gap:5px;height:66px;margin-top:12px}
.trend .bars div{flex:1;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#A78BFA,#7C3AED);min-height:8px;opacity:.9}
.trend .bars div.now{background:linear-gradient(180deg,#7C3AED,#4C1D95);opacity:1}
.trend .ax{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--muted);font-weight:600}

/* ── bottom sheet ──────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(21,19,42,.42);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow-y:auto;
  animation:up .28s cubic-bezier(.22,1,.36,1)}
.handle{width:38px;height:4px;border-radius:999px;background:var(--border);margin:0 auto 16px}
.sheet h2{font-family:var(--font-d);font-size:19px;font-weight:800;letter-spacing:-.025em;margin:0 0 4px}
.sheet .sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;font-weight:500}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:13px 15px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--surface);margin-bottom:9px;transition:border-color .15s,background .15s}
.opt[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft)}
.opt .ok{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt[aria-pressed="true"] .ok{background:var(--violet);border-color:var(--violet);color:#fff}
.opt b{font-family:var(--font-d);font-size:14px;font-weight:600;flex:1}
.opt span{font-size:11.5px;color:var(--muted);font-weight:500}
.alert{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
.alert:first-of-type{border-top:none}
.alert .ai{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alert .ab{min-width:0;flex:1}
.alert .ab b{font-family:var(--font-d);font-size:13.5px;font-weight:700;display:block;letter-spacing:-.01em}
.alert .ab p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.alert .ab em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.metric{margin-bottom:16px}
.metric .mh{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.metric .mh b{font-family:var(--font-d);font-size:13.5px;font-weight:700;flex:1}
.metric .mh span{font-size:12px;font-weight:700;color:var(--ink-2)}
.metric .track{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.metric .track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#A78BFA,#6D28D9)}
.metric p{margin:6px 0 0;font-size:11.5px;color:var(--muted);line-height:1.45}

/* ── barra de navegação: pílula flutuante com ação central ────────────────
   Antes: faixa colada nas laterais, com divisória em cima e quatro abas
   iguais. Agora, o modelo: a barra virou uma pílula solta (12px das laterais,
   8px do fundo), sem divisória, com uma ação circular no meio.
   O recorte ao redor do botão é um furo na máscara da pílula — o círculo tem
   o mesmo centro do botão, então o vão entre os dois é constante em qualquer
   largura, e o botão é um irmão fora da máscara (se fosse filho, o furo o
   cortaria). --fab-d/--fab-r controlam botão e furo juntos. */
.tabs{--fab-d:62px;--fab-r:34px;
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));
  width:min(calc(100% - 24px),496px);z-index:40;
  display:grid;grid-template-columns:1fr 1fr calc(var(--fab-d) + 6px) 1fr 1fr;
  padding:8px 4px}
/* no desktop o app vive numa tela de 520px com 28px de respiro em cima e
   embaixo: a barra fixa precisa subir junto para não sair do aparelho */
@media (min-width:640px){ .tabs{bottom:calc(36px + env(safe-area-inset-bottom,0px))} }
@media (min-width:640px) and (max-height:900px){ .tabs{bottom:calc(8px + env(safe-area-inset-bottom,0px))} }
.tabs-bg{position:absolute;inset:0;z-index:0;border-radius:26px;background:rgba(255,255,255,.9);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:0 -1px 0 rgba(21,19,42,.04),0 10px 30px -12px rgba(21,19,42,.3);
  -webkit-mask:radial-gradient(circle var(--fab-r) at 50% 0,transparent calc(var(--fab-r) - 1px),#000 var(--fab-r));
  mask:radial-gradient(circle var(--fab-r) at 50% 0,transparent calc(var(--fab-r) - 1px),#000 var(--fab-r))}
.tabs button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;min-height:52px;min-width:0;border-radius:18px;color:var(--ink-2);
  font-family:var(--font-d);font-size:11px;font-weight:700;letter-spacing:-.01em;
  transition:color .15s,background .15s}
.tabs button > span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button:hover{color:var(--violet-deep);background:var(--violet-soft)}
.tabs button[aria-current="page"]{color:var(--violet)}
.tabs button[aria-current="page"] svg{stroke-width:2.4}
/* ação central: meia altura para fora da barra, dentro do furo da máscara */
.tabs .tabs-fab{position:absolute;left:50%;top:calc(var(--fab-d) / -2);transform:translateX(-50%);
  width:var(--fab-d);height:var(--fab-d);min-height:0;border-radius:50%;gap:0;
  background:linear-gradient(158deg,var(--violet-bright),var(--violet-deep));color:#fff;
  box-shadow:0 10px 20px -6px rgba(76,29,149,.5),0 3px 8px -2px rgba(21,19,42,.22);
  transition:transform .14s cubic-bezier(.22,1,.36,1),box-shadow .18s}
.tabs .tabs-fab:hover{transform:translateX(-50%) scale(1.06);color:#fff;
  box-shadow:0 14px 26px -6px rgba(76,29,149,.58),0 4px 10px -2px rgba(21,19,42,.24)}
.tabs .tabs-fab:active{transform:translateX(-50%) scale(.96)}
.tabs .tabs-fab:focus-visible{outline:none;box-shadow:0 10px 20px -6px rgba(76,29,149,.5),0 0 0 3px #fff,0 0 0 6px var(--violet)}
@media (max-width:359px){
  .tabs{--fab-d:56px;--fab-r:31px}
  .tabs button{font-size:9.5px}
}

/* ── estados ───────────────────────────────────────────────────────────── */
.empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:36px 22px;text-align:center;box-shadow:var(--shadow-sm)}
.empty .ei{width:52px;height:52px;border-radius:18px;background:var(--violet-soft);color:var(--violet);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty b{font-family:var(--font-d);font-size:15px;font-weight:700;display:block;margin-bottom:5px}
.empty p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
/* confirmação do lançamento: duas linhas — o que foi feito e o que sobrou */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom,0px));z-index:95;
  width:max-content;max-width:min(92vw,420px);background:#15132A;color:#fff;border-radius:16px;padding:12px 16px;
  box-shadow:0 12px 30px -8px rgba(21,19,42,.5);display:flex;flex-direction:column;gap:2px;
  animation:upc .24s cubic-bezier(.22,1,.36,1)}
.toast b{font-family:var(--font-d);font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.toast span{font-size:12px;font-weight:500;color:#D9D5EC;line-height:1.35}

/* ── formulário de valor (folha de pagamento) ──────────────────────────── */
.fld{display:block;margin-bottom:10px}
.fld-lbl{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.fld-box{display:flex;align-items:center;gap:9px;min-height:56px;padding:0 15px;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.fld-box:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
.fld-box.is-err{border-color:var(--expense);box-shadow:0 0 0 3px var(--expense-soft)}
.fld-box > span{font-family:var(--font-d);font-weight:800;font-size:15px;color:var(--muted)}
.fld-box input{flex:1;min-width:0;border:none;outline:none;background:none;font-family:var(--font-d);
  font-size:23px;font-weight:800;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
  font-family:var(--font-d);font-size:12px;font-weight:700;color:var(--ink-2);transition:background .15s,border-color .15s,color .15s}
.chip:hover{background:var(--violet-soft);border-color:var(--violet-deep);color:var(--violet-deep)}
.fld-err{min-height:17px;margin:0 0 12px;font-size:12px;font-weight:600;color:var(--expense);line-height:1.35}
.pg-rows{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:14px}
.pg-rows > div{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-top:1px solid var(--border);min-width:0}
.pg-rows > div:first-child{border-top:none}
.pg-rows span{font-size:12.5px;color:var(--ink-2);font-weight:500;flex:1;min-width:0}
.pg-rows b{font-family:var(--font-d);font-size:14px;font-weight:700;white-space:nowrap}
.pg-rows .is-fim{background:var(--surface-2)}
.pg-rows .is-fim span{font-weight:600;color:var(--ink)}
.pg-rows .is-fim b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.sheet-nota{margin:10px 0 0;font-size:11.5px;color:var(--muted);line-height:1.45;text-align:center}

/* animação de entrada ── */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
/* o toast é centrado por transform: a entrada precisa preservar o -50% */
@keyframes upc{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .45s cubic-bezier(.22,1,.36,1) both}
.d1{animation-delay:.04s}.d2{animation-delay:.09s}.d3{animation-delay:.14s}.d4{animation-delay:.19s}.d5{animation-delay:.24s}
@keyframes draw{to{stroke-dashoffset:0}}
.line-anim{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.5s cubic-bezier(.4,0,.2,1) .25s forwards}
@keyframes grow{from{opacity:0}to{opacity:1}}
.area-anim{opacity:0;animation:grow .9s ease .8s forwards}
</style>
</head>
<body>

<div class="devbar" id="devbar">
  <b>Início — mobile</b>
  <button id="b-data" aria-pressed="false" onclick="toggleEmpty()">Estado vazio</button>
</div>

<div class="screen" id="screen">
  <div id="app"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

/* ───────────── ícones de traço ───────────── */
const mk = (kids, sw) => (p) => React.createElement('svg', {
  width: p.size || 20, height: p.size || 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
  strokeWidth: p.sw || sw || 1.9, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': 'true',
}, kids);
const I = {
  Bell: mk(<><path d="M6.6 16.4v-5a5.4 5.4 0 0 1 10.8 0v5l1.5 2.1H5.1z"/><path d="M10 20.6a2 2 0 0 0 4 0"/></>),
  Filter: mk(<><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></>),
  Left: mk(<><path d="M14.5 6 9 12l5.5 6"/></>),
  Right: mk(<><path d="M9.5 6 15 12l-5.5 6"/></>),
  Down: mk(<><path d="M12 5v13"/><path d="M6.5 12.5 12 18l5.5-5.5"/></>),
  Up: mk(<><path d="M12 19V6"/><path d="M6.5 11.5 12 6l5.5 5.5"/></>),
  Home: mk(<><path d="M3.5 10.4 12 3.4l8.5 7"/><path d="M5.8 9.6V20.6h12.4V9.6"/><path d="M9.8 20.6v-5.2h4.4v5.2"/></>),
  List: mk(<><path d="M8 6.5h12M8 12h12M8 17.5h12"/><circle cx="4.2" cy="6.5" r="1.1"/><circle cx="4.2" cy="12" r="1.1"/><circle cx="4.2" cy="17.5" r="1.1"/></>),
  Chart: mk(<><path d="M4 20V4.5"/><path d="M4 20h15.5"/><rect x="7.6" y="12" width="3" height="5" rx="1"/><rect x="13" y="8" width="3" height="9" rx="1"/></>),
  Grid: mk(<><rect x="3.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2.2"/></>),
  Wallet: mk(<><rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M3 10.6h18"/><circle cx="17" cy="14.8" r="1.3"/></>),

/* ───────────── cálculo ───────────── */
const fmt = (v, dec) => (v < 0 ? '−' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', {
  minimumFractionDigits: dec === 0 ? 0 : 2, maximumFractionDigits: dec === 0 ? 0 : 2 });
const dia = (n) => String(n).padStart(2, '0') + '/09';

function modelo(contas) {
  const aPagar = contas.filter((c) => c.tipo === 'despesa').reduce((s, c) => s + c.valor, 0);
  const aReceber = contas.filter((c) => c.tipo === 'receita').reduce((s, c) => s + c.valor, 0);
  const porDia = {};
  contas.forEach((c) => { porDia[c.indic] = (porDia[c.indic] || 0) + (c.tipo === 'receita' ? c.valor : -c.valor); });
  let saldo = DISPONIVEL; const serie = [];
  for (let d = 1; d <= 30; d++) { if (porDia[d]) saldo += porDia[d]; serie.push({ dia: d, saldo: Math.round(saldo) }); }
  const vals = serie.map((s) => s.saldo);
  const iMin = vals.indexOf(Math.min(...vals)), iMax = vals.indexOf(Math.max(...vals));
  return {
    contas, aPagar, aReceber, serie,
    fimMes: DISPONIVEL + aReceber - aPagar,
    minDia: serie[iMin].dia, minSaldo: serie[iMin].saldo,
    maxDia: serie[iMax].dia, maxSaldo: serie[iMax].saldo,
    hojeSaldo: serie.find((s) => s.dia === HOJE).saldo,
    reservaDisp: RESERVA.aporte - RESERVA.usado,
    reservaPct: (RESERVA.usado / RESERVA.aporte) * 100,
    mercadoResta: MERCADO.limite - MERCADO.gasto,
    mercadoPct: (MERCADO.gasto / MERCADO.limite) * 100,
  };
}

/* Ordem da lista: o vencimento manda. Quitadas descem para o fim — já saíram
   do que exige decisão, e a seção se chama "contas em aberto". */
function relevantes(m) {
  return [...m.contas].sort((a, b) => {
    const qa = quitadaDe(a) ? 1 : 0, qb = quitadaDe(b) ? 1 : 0;
    if (qa !== qb) return qa - qb;
    if (a.vence !== b.vence) return a.vence - b.vence;
    return a.indic - b.indic;
  });
}

const restanteDe = (c) => Math.max(0, c.valor - Math.min(c.pago || 0, c.valor));
const quitadaDe = (c) => restanteDe(c) === 0;
const dataCurta = (n) => String(n).padStart(2, '0') + '/09';

/* Estado do cartão pelo VENCIMENTO, que é a data que o mundo cobra. A data do
   motor é uma recomendação e vive no quadro ao lado: antes as duas eram
   tratadas como a mesma coisa, e um cartão que vencia hoje podia ser lido
   como "em 2 dias". O rótulo é curto porque divide o quadro com a data; a
   versão por extenso (estadoLongo) fica para a folha de detalhes. */
function estadoDe(c) {
  if (quitadaDe(c)) return c.tipo === 'receita'
    ? { l: 'Recebido', tone: 'in', ic: 'Check' }
    : { l: 'Pago', tone: 'done', ic: 'Check' };
  const d = c.vence - HOJE;
  if (d < 0) return { l: 'Atrasada ' + Math.abs(d) + 'd', tone: 'late', ic: 'AlertTri' };
  if (d === 0) return { l: 'Hoje', tone: 'today', ic: 'Bolt' };
  return { l: 'Em ' + d + 'd', tone: d <= 7 ? 'soon' : 'later', ic: 'Calendar' };
}

function estadoLongo(c) {
  if (quitadaDe(c)) return c.tipo === 'receita' ? 'recebido' : 'pago';
  const d = c.vence - HOJE;
  if (d < 0) return 'atrasada há ' + Math.abs(d) + (Math.abs(d) === 1 ? ' dia' : ' dias');
  if (d === 0) return 'vence hoje';
  return 'vence em ' + d + (d === 1 ? ' dia' : ' dias');
}

/* Janela calculada pelo motor de fluxo de caixa — a data em que o pagamento
   cabe no caixa do dia. Só existe enquanto houver valor em aberto, e quando
   já passou ela vira o alerta vermelho do cartão. */
function janelaDe(c) {
  if (quitadaDe(c)) return null;
  const verbo = c.tipo === 'receita' ? 'Receber' : 'Pagar';
  const d = c.indic - HOJE;
  if (d < 0) return { l: 'Janela ideal encerrou', d: dataCurta(c.indic), tone: 'late', ic: 'AlertTri' };
  if (d === 0) return { l: verbo + ' hoje', d: null, tone: 'today', ic: 'Bolt' };
  return { l: verbo + ' até', d: dataCurta(c.indic), tone: 'ideal', ic: 'Sparkle' };
}

/* Cor do cartão = sinal do dinheiro, não prioridade (a regra do sistema v2:
   cor é semântica). Antes a cor vinha do rótulo de prioridade, então três dos
   cinco cartões ficavam vermelhos ou âmbar por causa de uma etiqueta — e o
   prazo real não tinha como aparecer em cor nenhuma. A urgência agora tem o
   selo de estado, e a ação tem sempre o violeta, que é a cor de ação. */
function temaDe(c) {
  if (c.tipo === 'receita') return { accent: 'var(--income)', soft: 'var(--income-soft)' };
  return { accent: 'var(--expense)', soft: 'var(--expense-soft)' };
}
/* a prioridade vira texto na linha de contexto do cartão — o selo colorido
   saiu porque a cor do cartão já é do dinheiro, e duas escalas de cor no
   mesmo cartão não se explicam sozinhas */
const PRIO_LABEL = { essencial: 'Essencial', importante: 'Importante', flexivel: 'Flexível' };
function metaDe(c) {
  if (c.parcela) return { l: 'Parcela ' + c.parcela, ic: 'Layers' };
  if (c.freq === 'recorrente') return { l: 'Recorrente', ic: 'Repeat' };
  return { l: 'Única', ic: 'Calendar' };
}

/* ───────────── gráfico de linha suave ───────────── */
function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = 'M' + pts[0][0].toFixed(2) + ' ' + pts[0][1].toFixed(2);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ' C' + c1x.toFixed(2) + ' ' + c1y.toFixed(2) + ' ' + c2x.toFixed(2) + ' ' + c2y.toFixed(2) + ' ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2);
  }
  return d;
}

/* Gráfico do saldo previsto — agora com eixo legível em vez de linha muda:
   quatro datas na base (a do dia atual em branco, com o rótulo "HOJE" e uma
   linha-guia até a curva), três valores de referência na coluna da direita,
   o ponto grave do mês (menor saldo) marcado em âmbar, e a leitura do ponto
   sob o cursor/dedo. A leitura não tem título próprio: ela repete, menor, o
   valor que já está escrito no herói — quem quiser o resumo olha o card de
   saldo, quem quiser o detalhe passa o dedo.
   Teclado: o gráfico é focável e as setas ← → percorrem os dias, para a
   leitura não depender do mouse ou do toque. */
function GraficoSaldo({ m }) {
  const W = 320, H = 132, PL = 10, PR = 56, PT = 14, PB = 28;
  const [idx, setIdx] = useState(null);
  const boxRef = useRef(null);
  const timer = useRef(null);
  const iw = W - PL - PR, ih = H - PT - PB;
  const vals = m.serie.map((s) => s.saldo);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = hi - lo || 1;
  const x = (i) => PL + (i / (m.serie.length - 1)) * iw;
  const y = (v) => PT + ih - ((v - lo) / span) * ih;
  const pts = m.serie.map((s, i) => [x(i), y(s.saldo)]);
  const line = smoothPath(pts);
  const area = line + ' L' + pts[pts.length - 1][0].toFixed(2) + ' ' + (PT + ih) + ' L' + pts[0][0].toFixed(2) + ' ' + (PT + ih) + ' Z';
  const hojeIdx = HOJE - 1;
  const datas = [1, 10, 20, 30];

  const posDe = (clientX) => {
    const r = boxRef.current.getBoundingClientRect();
    const rel = ((clientX - r.left) / r.width) * W;
    return Math.max(0, Math.min(m.serie.length - 1, Math.round(((rel - PL) / iw) * (m.serie.length - 1))));
  };
  const marcar = (clientX) => { clearTimeout(timer.current); setIdx(posDe(clientX)); };
  const soltar = (tipo) => {
    clearTimeout(timer.current);
    // no dedo a leitura fica um instante depois de levantar: sem isso o
    // número desaparece antes de dar tempo de ler
    if (tipo === 'touch') timer.current = setTimeout(() => setIdx(null), 2600);
    else setIdx(null);
  };
  useEffect(() => () => clearTimeout(timer.current), []);
  const andar = (e) => {
    const passo = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!passo) return;
    e.preventDefault();
    setIdx(Math.max(0, Math.min(m.serie.length - 1, (idx == null ? hojeIdx : idx) + passo)));
  };

  const p = idx != null ? m.serie[idx] : null;
  const tipX = p ? (x(idx) / W) * 100 : 0;
  const tipY = p ? (y(p.saldo) / H) * 100 : 0;
  const tipAbaixo = tipY < 42;

  return (
    <div className="hf-chart" ref={boxRef} tabIndex={0} role="img"
      onKeyDown={andar} onBlur={() => setIdx(null)}
      onPointerDown={(e) => { e.currentTarget.setPointerCapture(e.pointerId); marcar(e.clientX); }}
      onPointerMove={(e) => marcar(e.clientX)}
      onPointerUp={(e) => { if (e.pointerType === 'touch') soltar('touch'); }}
      onPointerCancel={() => soltar('touch')}
      onPointerLeave={(e) => { if (e.pointerType !== 'touch') soltar('mouse'); }}
      aria-label={'Saldo previsto dia a dia em setembro: menor valor ' + fmt(lo, 0) + ' no dia ' + m.minDia
        + ', maior valor ' + fmt(hi, 0) + '. Passe o dedo sobre o gráfico ou use as setas para ver um dia.'}>
      <svg viewBox={'0 0 ' + W + ' ' + H} width="100%" height={H} aria-hidden="true">
        <defs>
          <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#22D3EE" stopOpacity="0.42" />
            <stop offset="55%" stopColor="#2DD4BF" stopOpacity="0.16" />
            <stop offset="100%" stopColor="#34D399" stopOpacity="0" />
          </linearGradient>
          <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#22D3EE" />
            <stop offset="55%" stopColor="#2DD4BF" />
            <stop offset="100%" stopColor="#34D399" />
          </linearGradient>
          <filter id="fGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3.4" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        {/* valores de referência: a grade deixa de ser decorativa e passa a
            dizer de quanto é cada linha */}
        {[0, 0.5, 1].map((f, i) => (
          <g key={f}>
            <line x1={PL} x2={W - PR} y1={PT + ih * f} y2={PT + ih * f} stroke="rgba(255,255,255,.20)" strokeWidth="1" strokeDasharray="3 6" />
            <text x={W - 2} y={PT + ih * f + 3.4} textAnchor="end" fontSize="9" fontWeight="600" fill="#EDE9FE" opacity=".82">
              {fmt(i === 0 ? hi : i === 1 ? (hi + lo) / 2 : lo, 0)}
            </text>
          </g>
        ))}

        {/* datas principais na base; a do dia atual em branco e com o rótulo.
            Estas ficam sobre a onda, então vão em cor cheia — com 78% de
            opacidade o contraste caía para 3,9:1 em texto de 10px. */}
        {datas.map((d) => (
          <text key={d} x={x(d - 1)} y={H - 14} textAnchor={d === 1 ? 'start' : d === 30 ? 'end' : 'middle'}
            fontSize="9" fontWeight={d === HOJE ? 800 : 600} fill={d === HOJE ? '#FFFFFF' : '#EDE9FE'}>
            {dia(d)}
          </text>
        ))}
        <text x={x(hojeIdx)} y={H - 4} textAnchor="middle" fontSize="8" fontWeight="800" letterSpacing=".1em" fill="#FFFFFF">HOJE</text>

        <path d={area} fill="url(#gArea)" className="area-anim" />
        <path d={line} fill="none" stroke="url(#gLine)" strokeWidth="3" strokeLinecap="round" filter="url(#fGlow)" className="line-anim" />

        {/* dia atual: linha-guia até a base + ponto */}
        <line x1={x(hojeIdx)} x2={x(hojeIdx)} y1={y(m.serie[hojeIdx].saldo) + 6} y2={PT + ih}
          stroke="rgba(255,255,255,.34)" strokeWidth="1" strokeDasharray="2 4" />
        <circle cx={x(hojeIdx)} cy={y(m.serie[hojeIdx].saldo)} r="9.5" fill="#22D3EE" opacity=".22" />
        <circle cx={x(hojeIdx)} cy={y(m.serie[hojeIdx].saldo)} r="4.6" fill="#fff" stroke="#22D3EE" strokeWidth="2.6" />

        {/* dia de menor saldo — o momento crítico do mês */}
        <circle cx={x(m.minDia - 1)} cy={y(m.minSaldo)} r="8.5" fill="#FBBF24" opacity=".25" />
        <circle cx={x(m.minDia - 1)} cy={y(m.minSaldo)} r="4" fill="#FBBF24" stroke="#78350F" strokeWidth="1" strokeOpacity=".35" />

        {/* ponto sob o cursor/dedo */}
        {p && (
          <>
            <line x1={x(idx)} x2={x(idx)} y1={PT - 6} y2={PT + ih} stroke="rgba(255,255,255,.5)" strokeWidth="1" strokeDasharray="3 3" />
            <circle cx={x(idx)} cy={y(p.saldo)} r="8" fill="#fff" opacity=".16" />
            <circle cx={x(idx)} cy={y(p.saldo)} r="4.4" fill="#fff" stroke="#22D3EE" strokeWidth="2.4" />
          </>
        )}
      </svg>

      {/* leitura do ponto: acompanha o dedo e é presa dentro do cartão pelo
          clamp — nas pontas do mês ela encosta na borda em vez de vazar */}
      {p && (
        <div className={'hf-tip' + (tipAbaixo ? ' abaixo' : '')}
          style={{ left: 'clamp(48px, ' + tipX + '%, calc(100% - 48px))', top: tipY + '%' }}>
          <span>{dia(p.dia)}{idx === hojeIdx ? ' · hoje' : ''}</span>
          <b className="num">{fmt(p.saldo, 0)}</b>
        </div>
      )}

      {/* onda decorativa: transição suave entre o herói e o conteúdo abaixo */}
      <svg className="hf-wave" viewBox="0 0 320 46" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="gWave1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#8B5CF6" stopOpacity=".55" />
            <stop offset="100%" stopColor="#6366F1" stopOpacity=".55" />
          </linearGradient>
          <linearGradient id="gWave2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#A78BFA" stopOpacity=".5" />
            <stop offset="100%" stopColor="#818CF8" stopOpacity=".5" />
          </linearGradient>
        </defs>
        <path d="M0 22 C 55 4, 105 40, 170 24 S 265 6, 320 20 V46 H0 Z" fill="url(#gWave1)" />
        <path d="M0 32 C 70 18, 135 44, 200 30 S 275 16, 320 30 V46 H0 Z" fill="url(#gWave2)" />
      </svg>
    </div>
  );
}

/* ───────────── sheets ───────────── */
function Sheet({ titulo, sub, onClose, children }) {
  useEffect(() => {
    const esc = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', esc);
    const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', esc); document.body.style.overflow = prev; };
  }, [onClose]);
  return (
    <div className="scrim" onClick={onClose} role="dialog" aria-modal="true" aria-label={titulo}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="handle" />
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
          <div style={{ flex: 1 }}>
            <h2>{titulo}</h2>
            {sub && <p className="sub">{sub}</p>}
          </div>
          <button className="iconbtn plain" onClick={onClose} aria-label="Fechar" style={{ marginTop: -6 }}><I.X size={18} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ── folha de pagamento ──────────────────────────────────────────────────
   O único lugar da tela com ação sólida. O valor vem preenchido com o que
   está em aberto (o caso mais comum é quitar), os atalhos cobrem pagamento
   parcial e a validação impede valor zero ou maior que a dívida — antes o
   botão "Registrar pagamento" só fechava a folha. */
const valorBR = (n) => n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function paraNumero(s) {
  let t = String(s).replace(/[^\d.,]/g, '');
  if (!t) return 0;
  const pontos = (t.match(/\./g) || []).length;
  if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
  else if (pontos > 1) t = t.replace(/\./g, '');
  else if (pontos === 1 && t.split('.')[1].length === 3) t = t.replace('.', '');
  const n = parseFloat(t);
  return isNaN(n) ? 0 : n;
}

function PagamentoSheet({ conta, onClose, onConfirmar }) {
  const receita = conta.tipo === 'receita';
  const restante = restanteDe(conta);
  const jaPago = Math.min(conta.pago || 0, conta.valor);
  const [txt, setTxt] = useState(() => valorBR(restante));
  const [tocado, setTocado] = useState(false);
  const val = paraNumero(txt);
  const erro = val <= 0
    ? 'Informe um valor maior que zero.'
    : val > restante + 0.005 ? 'O máximo é ' + fmt(restante, 0) + ' — o valor em aberto.' : '';
  const erroOn = tocado && !!erro;
  const confirma = () => { setTocado(true); if (erro) return; onConfirmar(conta.id, val); };
  const atalhos = [{ l: '25%', v: restante * 0.25 }, { l: '50%', v: restante * 0.5 }, { l: 'Tudo', v: restante }];
  const depois = Math.max(0, restante - (val > 0 ? val : 0));
  return (
    <Sheet titulo={receita ? 'Registrar recebimento' : 'Registrar pagamento'}
      sub={conta.desc + ' · vence ' + dataCurta(conta.vence)} onClose={onClose}>
      <label className="fld" htmlFor="pg-valor">
        <span className="fld-lbl">{receita ? 'Valor recebido' : 'Valor pago'}</span>
        <span className={'fld-box' + (erroOn ? ' is-err' : '')}>
          <span>R$</span>
          <input id="pg-valor" data-od-id="campo-valor" inputMode="decimal" autoComplete="off" value={txt}
            onChange={(e) => { setTxt(e.target.value); setTocado(false); }}
            onBlur={() => setTocado(true)}
            aria-invalid={erroOn} aria-describedby="pg-erro" />
        </span>
      </label>
      <div className="chips">
        {atalhos.map((a) => (
          <button key={a.l} className="chip" onClick={() => { setTocado(false); setTxt(valorBR(a.v)); }}>
            {a.l} · {fmt(a.v, 0)}
          </button>
        ))}
      </div>
      <p className="fld-err" id="pg-erro" role="alert">{erroOn ? erro : ''}</p>

      <div className="pg-rows">
        <div><span>Valor da conta</span><b className="num">{fmt(conta.valor, 0)}</b></div>
        <div><span>{receita ? 'Já recebido' : 'Já pago'}</span><b className="num">{fmt(jaPago, 0)}</b></div>
        <div><span>{receita ? 'A receber' : 'A pagar'}</span><b className="num">{fmt(restante, 0)}</b></div>
        <div className="is-fim"><span>Depois deste lançamento</span><b className="num">{fmt(depois, 0)}</b></div>
      </div>

      <button className="cta solid" data-od-id="confirmar-pagamento" onClick={confirma} disabled={erroOn}>
        <I.Check size={16} /> {receita ? 'Confirmar recebimento' : 'Confirmar pagamento'}
      </button>
      <p className="sheet-nota">O lançamento entra em setembro e o cartão da conta é atualizado na hora.</p>
    </Sheet>
  );
}

/* ───────────── telas ───────────── */
/* Linha de progresso: nome, valor atual / total, barra 0→total, % usado.
   Substitui os três cards. É leve de propósito — sem caixa própria, dentro de
   um único cartão com divisórias, para não virar três blocos pesados. */
const Ic2 = ({ ic }) => { const C = I[ic] || I.Dot; return <C size={14} />; };
const notaCor = (cor) => cor === 'i-in' ? 'var(--income)' : cor === 'i-w' ? 'var(--warn)' : 'var(--violet)';

/* card compacto (metade da largura), usado em par para reserva mínima + mercado
   logo abaixo do gráfico — mesmo espírito do cartão pequeno, em grade de duas
   colunas em vez de linhas empilhadas. */
function CardMini({ ic, cor, nome, valor, total, pct, nota, onClick }) {
  return (
    <button className="minicard" onClick={onClick}>
      <span className="mt"><i className={cor}><Ic2 ic={ic} /></i><span>{nome}</span></span>
      <b className="num">{valor}</b>
      <span className="bar"><i style={{ width: Math.min(100, pct) + '%', background: notaCor(cor) }} /></span>
      <u className="num" style={{ color: notaCor(cor) }}>{nota}</u>
    </button>
  );
}

function Inicio({ m, quem, setQuem, onSheet, vazio, mes }) {
  const lista = relevantes(m);
  const mask = (v) => fmt(v, 0);
  // percentuais de consumo (0 = nada usado, 100 = total comprometido)
  const pctRes = Math.round((RESERVA.usado / RESERVA.aporte) * 100);
  const pctMer = Math.round((MERCADO.gasto / MERCADO.limite) * 100);
  // resumo da seção: só o que ainda está em aberto entra na conta
  const emAberto = lista.filter((c) => !quitadaDe(c)).length;
  const aPagar = lista.reduce((s, c) => s + (c.tipo === 'despesa' ? restanteDe(c) : 0), 0);
  const aReceber = lista.reduce((s, c) => s + (c.tipo === 'receita' ? restanteDe(c) : 0), 0);
  if (vazio) {
    return (
      <div className="stage">
        <div className="empty">
          <span className="ei"><I.List size={22} /></span>
          <b>Nenhum lançamento em setembro</b>
          <p>Cadastre uma receita ou um gasto e o saldo previsto, os indicadores e as contas em aberto aparecem aqui automaticamente.</p>
        </div>
      </div>
    );
  }
  return (
    <>
      <div className="stage">
        {/* Reserva e mercado: o número grande é o que ainda dá para usar e a
            legenda traz o total do mês. Antes o mesmo valor aparecia duas
            vezes (no número e em "restam R$ …"). */}
        <div className="twocards rise d2">
          <CardMini ic="Pig" cor="i-in" nome="Reserva mínima"
            valor={mask(m.reservaDisp)} total={mask(RESERVA.aporte)} pct={pctRes}
            nota={'de ' + mask(RESERVA.aporte)} onClick={() => onSheet('reserva')} />
          <CardMini ic="Cart" cor="i-w" nome="Mercado"
            valor={mask(m.mercadoResta)} total={mask(MERCADO.limite)} pct={pctMer}
            nota={'de ' + mask(MERCADO.limite)} onClick={() => onSheet('mercado')} />
        </div>

        {/* CONTAS EM ABERTO — cada cartão conta uma coisa por linha: título,
            prazo (selo), quanto ainda está em aberto, progresso (só quando
            existe pagamento parcial) e a data que o motor calculou. Antes o
            vencimento aparecia duas vezes, o "Pendente" se repetia nos cinco
            cartões e três deles mostravam barra vazia com "Pago R$ 0". */}
        <section className="sect rise d4" aria-labelledby="t-contas" data-od-id="sec-contas">
          <div className="sect-h">
            <h2 id="t-contas">Contas em aberto</h2>
            <span style={{ marginLeft: 'auto' }}>{emAberto} em aberto</span>
          </div>

          {aPagar + aReceber > 0 ? (
            <div className="bc-sum" data-od-id="resumo-contas">
              {aPagar > 0 && (
                <span className="bc-sum-i out"><I.Down size={13} /> <b className="num">{fmt(aPagar, 0)}</b> a pagar</span>
              )}
              {aReceber > 0 && (
                <span className="bc-sum-i in"><I.Up size={13} /> <b className="num">{fmt(aReceber, 0)}</b> a receber</span>
              )}
            </div>
          ) : (
            <p className="bc-sum-empty"><I.Check size={14} /> Tudo quitado em setembro.</p>
          )}

          <div className="billlist">
            {lista.map((c) => {
              const cat = CATS[c.cat] || CATS.outros;
              const Ic = I[c.icon] || I[cat.i] || I.Dot;
              const receita = c.tipo === 'receita';
              const tema = temaDe(c);
              const meta = metaDe(c);
              const tipoLbl = receita ? 'Receita' : (PRIO_LABEL[c.prio] || 'Despesa');
              const pessoa = c.who ? PESSOAS.find((p) => p.id === c.who).n : 'Casal';
              const pago = Math.min(c.pago || 0, c.valor);
              const restante = restanteDe(c);
              const fechada = restante === 0;
              const pct = Math.min(100, Math.round((pago / c.valor) * 100));
              const est = estadoDe(c);
              const EstIc = I[est.ic] || I.Dot;
              const chipTone = est.tone === 'late' ? 'late' : est.tone === 'in' ? 'in'
                : est.tone === 'later' ? 'done' : 'warn';
              const jan = janelaDe(c);
              // O "%" e o rótulo da barra são posicionados por cálculo: o
              // número muda de lado quando o preenchimento é estreito demais
              // para contê-lo, e o rótulo não é desenhado quando a trilha
              // acaba. Nada de texto cortado em nenhum percentual.
              const dentro = pct >= 20;
              const comRotulo = pct <= 52;
              const posPct = dentro
                ? { left: (pct / 2) + '%', transform: 'translateX(-50%)', color: '#fff' }
                : { left: 'calc(' + pct + '% + 10px)', color: 'var(--ink)' };
              const posRot = { left: 'calc(' + pct + '% + ' + (dentro ? 12 : 50) + 'px)' };
              return (
                <div className={'billcard' + (fechada ? ' is-done' : '')} key={c.id} data-od-id={'conta-' + c.id}
                  style={{ '--bc-accent': tema.accent, '--bc-soft': tema.soft }}>
                  <button className="bc-body" onClick={() => onSheet('conta:' + c.id)}
                    aria-label={c.desc + ', ' + (fechada
                      ? (receita ? 'recebido ' : 'pago ') + fmt(c.valor, 0)
                      : fmt(restante, 0) + ' em aberto, ' + estadoLongo(c)) + '. Abrir detalhes'}>
                    <span className="bc-top">
                      <span className="bc-icon"><Ic size={20} /></span>
                      <span className="bc-info">
                        <span className="bc-title">{c.desc}</span>
                        <span className="bc-meta">{meta.l} · {tipoLbl} · {pessoa}</span>
                      </span>
                      <span className="bc-side">
                        <span className="bc-total num">{fmt(c.valor, 0)}</span>
                      </span>
                    </span>

                    <span className="bc-vals">
                      <span className="bc-val"><em>{receita ? 'Recebido:' : 'Pago:'}</em><b className="num">{fmt(pago, 0)}</b></span>
                      <span className="bc-val"><em>Restante:</em><b className="num">{fmt(restante, 0)}</b></span>
                    </span>

                    <span className="bc-bar">
                      <i style={{ width: pct + '%' }} />
                      <b className="num" style={posPct}>{pct}%</b>
                      {comRotulo && <u style={posRot}>do valor total</u>}
                    </span>

                    <span className={'bc-tiles' + (fechada ? ' one' : '')}>
                      <span className="bc-tile">
                        <span className="bc-tile-h"><i><I.Calendar size={15} /></i><span>Vencimento</span></span>
                        <span className="bc-tile-b">
                          <b className="num">{dataCurta(c.vence)}</b>
                          <span className={'bc-chip bc-chip-' + chipTone}><EstIc size={10} /> {est.l}</span>
                        </span>
                      </span>
                      {jan && (
                        <span className={'bc-tile money' + (jan.tone === 'late' ? ' past' : '')}>
                          <span className="bc-tile-h"><i><I.Target size={15} /></i><span>Recomendada</span></span>
                          <span className="bc-tile-b">
                            <b className="num">{jan.d || dataCurta(c.indic)}</b>
                            <span className={'bc-chip ' + (jan.tone === 'late' ? 'bc-chip-late' : 'bc-chip-ideal')}>
                              {jan.tone === 'late' ? 'Passou' : 'Ideal'}
                            </span>
                          </span>
                        </span>
                      )}
                    </span>
                  </button>

                  {fechada ? (
                    <span className={'bc-done-lbl' + (receita ? ' rec' : '')}>
                      <I.Check size={16} /> {receita ? 'Recebimento concluído' : 'Pagamento concluído'}
                    </span>
                  ) : (
                    <button className="bc-cta" data-od-id={'acao-conta-' + c.id}
                      onClick={(e) => { e.stopPropagation(); onSheet('pagar:' + c.id); }}>
                      {receita ? <><I.Download size={17} /> Registrar recebimento</> : <><I.Card size={17} /> Registrar pagamento</>}
                    </button>
                  )}
                </div>
              );
            })}
          </div>
          <button className="cta" data-od-id="ver-transacoes" onClick={() => onSheet('todas')}>
            Ver todas as transações <I.Right size={16} />
          </button>
        </section>

        {/* 5. 12 MESES — visão estratégica, sem competir com o gráfico do mês */}
        <section className="panel trend rise d5" aria-labelledby="t-trend" data-od-id="sec-12-meses" style={{ marginTop: 22 }}>
          <div className="panel-h">
            <div style={{ flex: 1 }}>
              <h2 id="t-trend">Saldo nos próximos 12 meses</h2>
              <p>Tendência com as recorrências já cadastradas</p>
            </div>
          </div>
          <div className="bars">
            {[23015, 29775, 36535, 43295, 50055, 56815, 63575, 70335, 77095, 83855, 90615, 97375].map((v, i) => (
              <div key={i} className={i === 0 ? 'now' : ''} style={{ height: ((v - 20000) / 78000) * 100 + '%' }} title={MES12[i] + ' · ' + fmt(v, 0)} />
            ))}
          </div>
          <div className="ax"><span>set/26</span><span>fev/27</span><span>ago/27</span></div>
          <div className="legend" style={{ marginTop: 12 }}>
            <i><b style={{ background: '#6D28D9' }} />mês atual</i>
            <i><b style={{ background: '#A78BFA' }} />projeção</i>
            <i style={{ color: 'var(--income)', fontWeight: 700 }}><I.Trend size={13} /> nenhum mês negativo</i>
          </div>
        </section>
      </div>
    </>
  );
}
